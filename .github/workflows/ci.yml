name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'setup.py', 'backend/pyproject.toml', 'backend/requirements.txt', 'backend/setup.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then python -m pip install -e .; fi
          if [ -f backend/pyproject.toml ] || [ -f backend/setup.py ]; then python -m pip install -e backend; fi
      - name: Run Python tests
        run: python -m pytest

  node-tests:
    if: ${{ hashFiles('package.json', 'frontend/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test root Node project
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test --if-present
      - name: Install and test frontend Node project
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test --if-present
